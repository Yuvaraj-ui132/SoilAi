name: SoilAI CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint Python
        run: ruff check --select E4,E7,E9,F backend
      - name: Test backend
        run: python -m pytest backend/tests -q
      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done
      - name: Build API container
        run: docker build -t soilai-backend-ci .
      - name: Smoke-test API container
        shell: bash
        run: |
          docker run -d --rm --name soilai-backend-ci -p 8080:8080 soilai-backend-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs soilai-backend-ci
          exit 1
      - name: Stop API container
        if: always()
        run: docker stop soilai-backend-ci || true
